<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- Filled by the launch gate (src/routes/play.js). Empty here on purpose. -->
  <meta name="child-id" content="">
  <meta name="app-id" content="">
  <title>Emotion Matcher</title>
  <link rel="stylesheet" href="/apps/emotion-match/css/app.css">
</head>
<body>
  <!-- js/main.js draws one question at a time into #screen, then the
       celebration after 8. Nothing is spoken until the child taps, and
       nothing moves on until the child chooses to. -->
  <main id="app" data-app-id="emotion-match">
    <header class="topbar">
      <h1 id="title">Emotion Matcher</h1>
      <button type="button" class="text-btn" id="grownups" hidden>Grown-ups</button>
    </header>

    <div id="screen"></div>

    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/apps/emotion-match/js/main.js"></script>
</body>
</html>
