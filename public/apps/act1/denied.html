<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not available right now</title>
  <style>
    /* Calm and high contrast: #14181f on #ffffff is 17.79:1; link #1d4ed8 is 6.70:1. No motion. */
    html { background: #ffffff; color: #14181f; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.5rem;
      line-height: 1.5;
      text-align: center;
    }
    main { max-width: 32rem; padding: 2rem; }
    p { margin: 0 0 2rem; }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      color: #1d4ed8;
      border: 3px solid #1d4ed8;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
    }
    a:focus-visible { outline: 3px solid #14181f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>This app is not available right now, so please ask a grown-up for help.</p>
    <a href="/parent">Back to my apps</a>
  </main>
</body>
</html>
