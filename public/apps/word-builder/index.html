<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- Filled by the launch gate (src/routes/play.js). Empty here on purpose. -->
  <meta name="child-id" content="">
  <meta name="app-id" content="">
  <title>Word Builder</title>
  <link rel="stylesheet" href="/apps/word-builder/css/app.css">
</head>
<body>
  <!-- js/main.js draws one screen at a time into #screen: the ladder list, a
       ladder being built, or the "show me how" walk-through. Nothing moves and
       nothing is spoken until the child taps. -->
  <main id="app" data-app-id="word-builder">
    <header class="topbar">
      <h1 id="title">Word Builder</h1>
      <button type="button" class="text-btn" id="grownups" hidden>Grown-ups</button>
    </header>

    <div id="screen"></div>

    <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/apps/word-builder/js/main.js"></script>
</body>
</html>
